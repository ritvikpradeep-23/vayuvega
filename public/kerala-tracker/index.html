<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAYUVEGA — Kerala Air Watch</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanline-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wordmark-block">
      <h1 class="wordmark">VAYUVEGA</h1>
      <p class="tagline">KERALA AIR WATCH</p>
    </div>
    <button id="mute-toggle" class="icon-btn" aria-label="Mute ticker sound" aria-pressed="false">
      <span id="mute-icon">🔊</span>
    </button>
  </header>

  <main class="map-wrap">
    <div id="map"></div>

    <aside id="legend" class="legend panel">
      <p class="panel-title">AQI BANDS</p>
      <ul>
        <li><span class="dot good"></span> GOOD · 0–50</li>
        <li><span class="dot moderate"></span> MODERATE · 51–100</li>
        <li><span class="dot poor"></span> POOR · 101–150</li>
        <li><span class="dot severe"></span> SEVERE · 151+</li>
      </ul>
    </aside>

    <div id="radar" class="radar panel" aria-hidden="true">
      <div class="radar-face">
        <div class="radar-sweep"></div>
        <div class="radar-ring r1"></div>
        <div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div>
      </div>
    </div>

    <section id="readout" class="readout panel" hidden>
      <button id="readout-close" class="icon-btn readout-close" aria-label="Close readout">✕</button>
      <p class="panel-title" id="readout-id">—</p>
      <h2 id="readout-name">—</h2>
      <div class="readout-grid">
        <div><span class="label">AQI</span><span id="readout-aqi" class="value">—</span></div>
        <div><span class="label">PM2.5</span><span id="readout-pm25" class="value">—</span></div>
        <div><span class="label">TEMP</span><span id="readout-temp" class="value">—</span></div>
        <div><span class="label">HUMIDITY</span><span id="readout-humidity" class="value">—</span></div>
      </div>
      <p class="readout-updated">LAST UPDATED <span id="readout-updated">—</span></p>
    </section>
  </main>

  <footer class="ticker-bar">
    <div class="ticker-track" id="ticker-track">
      <span id="ticker-text">LOADING STATION FEED…</span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
